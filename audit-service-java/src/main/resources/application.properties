spring.datasource.url=jdbc:h2:file:./data/auditdb;DB_CLOSE_DELAY=-1
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect
server.port=8081

# Optional: set a base64-encoded 32-byte master key for payload key wrapping
# Example (generate with openssl):
#   openssl rand -base64 32
# Then set either spring property or environment variable:
# spring property: audit.master-key=<base64-key>
# environment variable: AUDIT_MASTER_KEY=<base64-key>

# JWT Configuration
# Generate a 64-character secret key for JWT signing (512-bit HS512 key requirement)
jwt.secret=0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
# Token expiration in milliseconds (default: 86400000 = 24 hours)
jwt.expiration=86400000

# serve swagger ui at /swagger-ui.html
springdoc.swagger-ui.path=/swagger-ui.html
